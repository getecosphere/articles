name: articles
domain: articles
version: 1.0.0
publisher: stuff8
status: unverified
license: mit
summary: "Articles & content: CRUD, categories, search, admin publishing workflow"

targets:
  - linux/amd64

artifacts: {}

contract:
  version: 1
  api: "articles REST API"
  env:
    required:
      - SERVER_PORT
      - DATABASE_URL
      - JWT_SECRET
    optional:
      - CORS_ALLOWED_ORIGINS
      - PUBLIC_SITE_URL
      - ARTICLES_ADMIN_ONLY
  db: postgresql@15
  network:
    inbound: [http]
    outbound: [https]
  resources:
    memory: "128m"
    disk: "256m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: https://github.com/getecosphere/articles.git
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
