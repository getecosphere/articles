name: articles-ui
domain: articles
version: 0.2.0
publisher: stuff8
status: unverified
license: mit
summary: "Standalone native SSR UI for the articles domain: /articles + /articles/[slug] with SEO/OpenGraph"

targets:
  - linux/amd64
  - darwin/arm64

artifacts: {}

contract:
  version: 1
  api: "articles-ui pages: GET /articles/, GET /articles/[slug]/"
  env:
    required:
      - SERVER_PORT
    optional:
      - ARTICLES_API_URL
      - PUBLIC_SITE_URL
  db: "none"
  network:
    inbound: [http]
    outbound: [https]
  resources:
    memory: "128m"
    disk: "64m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: https://github.com/getecosphere/articles.git
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
